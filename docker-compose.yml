services:
  always-voice:
    build: .
    container_name: always-voice-bot
    restart: unless-stopped
    init: true
    depends_on:
      - nodelink
    environment:
      - TZ=Asia/Jakarta
      - TOKEN=${TOKEN:-}
      - GUILD_ID=${GUILD_ID:-}
      - CHANNEL_ID=${CHANNEL_ID:-}
      - VOICE_LIMIT=${VOICE_LIMIT:-0}
      - STATUS=${STATUS:-dnd}
      - SELF_MUTE=${SELF_MUTE:-True}
      - SELF_DEAF=${SELF_DEAF:-False}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - AUTO_WATCH_STREAM=${AUTO_WATCH_STREAM:-True}

      - AUTO_REPLY=${AUTO_REPLY:-False}
      - REPLY_DELAY=${REPLY_DELAY:-5}
      - REPLY_TRIGGER=${REPLY_TRIGGER:-hey wake up!}
      - REPLY_MESSAGE=${REPLY_MESSAGE:-yes}
      - UNDEAFEN_MIN_SECONDS=${UNDEAFEN_MIN_SECONDS:-300}
      - UNDEAFEN_MAX_SECONDS=${UNDEAFEN_MAX_SECONDS:-900}

      - MUSIC_ENABLED=${MUSIC_ENABLED:-True}
      - MUSIC_PREFIX=${MUSIC_PREFIX:-!}
      - NODELINK_HOST=${NODELINK_HOST:-nodelink}
      - NODELINK_PORT=${NODELINK_PORT:-3000}
      - NODELINK_PASSWORD=${NODELINK_PASSWORD:-youshallnotpass}

  nodelink:
    image: docker.io/performanc/nodelink:latest
    container_name: nodelink
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "2333:3000"
    environment:
      - NODELINK_PORT=3000
      - NODELINK_PASSWORD=youshallnotpass
      # Configure NodeLink to search strictly from YouTube
      - NODELINK_SEARCH_DEFAULTSOURCE=["youtube"]
      - NODELINK_DEFAULTSEARCHSOURCE=["youtube"]
      - NODELINK_SEARCH_UNIFIEDSOURCES=["youtube"]
      - NODELINK_UNIFIEDSEARCHSOURCES=["youtube"]
      # YouTube source settings
      - NODELINK_SOURCES_YOUTUBE_ENABLED=true
      - NODELINK_SOURCES_YOUTUBE_GETOAUTHTOKEN=${YOUTUBE_GET_OAUTH_TOKEN:-false}
      - NODELINK_SOURCES_YOUTUBE_CLIENTS_SETTINGS_TV_REFRESHTOKEN=["${YOUTUBE_REFRESH_TOKEN:-}"]
      - NODELINK_SOURCES_YOUTUBE_FALLBACKSOURCES=[]
      - NODELINK_SOURCES_YOUTUBE_CIPHER_URL=https://cipher.kikkia.dev/api
      # Spotify source settings
      - NODELINK_SOURCES_SPOTIFY_ENABLED=${SPOTIFY_ENABLED:-true}
      - NODELINK_SOURCES_SPOTIFY_CLIENTID=${SPOTIFY_CLIENT_ID:-}
      - NODELINK_SOURCES_SPOTIFY_CLIENTSECRET=${SPOTIFY_CLIENT_SECRET:-}
      - NODELINK_SOURCES_SPOTIFY_MARKET=${SPOTIFY_MARKET:-ID}
      # Disable non-YouTube search sources
      - NODELINK_SOURCES_SOUNDCLOUD_ENABLED=false
      - NODELINK_SOURCES_APPLEMUSIC_ENABLED=false
      - NODELINK_SOURCES_DEEZER_ENABLED=false
      - NODELINK_SOURCES_TIDAL_ENABLED=false
      - NODELINK_SOURCES_JIOSAAVN_ENABLED=false
      - NODELINK_SOURCES_GAANA_ENABLED=false
      - NODELINK_SOURCES_YANDEXMUSIC_ENABLED=false
      - NODELINK_SOURCES_VKMUSIC_ENABLED=false
      - NODELINK_SOURCES_AUDIUS_ENABLED=false
      - NODELINK_SOURCES_AUDIOMACK_ENABLED=false
      - NODELINK_SOURCES_BANDCAMP_ENABLED=false
      - NODELINK_SOURCES_BILIBILI_ENABLED=false
      - NODELINK_SOURCES_PANDORA_ENABLED=false
      - NODELINK_SOURCES_QOBUZ_ENABLED=false
