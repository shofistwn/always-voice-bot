services:
  always-voice:
    build: .
    image: always-voice:latest
    container_name: always-voice-bot
    restart: unless-stopped
    init: true
    environment:
      # System & Authentication
      - TZ=${TZ:-Asia/Jakarta}
      - TOKEN=${TOKEN:-}
      - GUILD_ID=${GUILD_ID:-}
      - CHANNEL_ID=${CHANNEL_ID:-}
      - LOG_LEVEL=${LOG_LEVEL:-info}

      # Voice & Presence Settings
      - STATUS=${STATUS:-dnd}
      - SELF_MUTE=${SELF_MUTE:-True}
      - SELF_DEAF=${SELF_DEAF:-False}
      - VOICE_LIMIT=${VOICE_LIMIT:-0}
      - AUTO_WATCH_STREAM=${AUTO_WATCH_STREAM:-True}

      # Auto-Reply Settings
      - AUTO_REPLY=${AUTO_REPLY:-False}
      - REPLY_TRIGGER=${REPLY_TRIGGER:-hey wake up!}
      - REPLY_MESSAGE=${REPLY_MESSAGE:-yes}
      - REPLY_DELAY=${REPLY_DELAY:-5}

      # OwO Assistant Settings
      - OWO_ASSISTANT=${OWO_ASSISTANT:-True}
