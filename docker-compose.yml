services:
  always-voice:
    build: .
    container_name: always-voice-bot
    restart: unless-stopped
    init: true
    environment:
      - TZ=Asia/Jakarta
      - TOKEN=${TOKEN:-}
      - GUILD_ID=${GUILD_ID:-}
      - CHANNEL_ID=${CHANNEL_ID:-}
      - VOICE_LIMIT=${VOICE_LIMIT:-0}
      - STATUS=${STATUS:-dnd}
      - SELF_MUTE=${SELF_MUTE:-True}
      - SELF_DEAF=${SELF_DEAF:-False}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - AUTO_WATCH_STREAM=${AUTO_WATCH_STREAM:-True}

      - AUTO_REPLY=${AUTO_REPLY:-False}
      - REPLY_DELAY=${REPLY_DELAY:-5}
      - REPLY_TRIGGER=${REPLY_TRIGGER:-hey wake up!}
      - REPLY_MESSAGE=${REPLY_MESSAGE:-yes}
      - UNDEAFEN_MIN_SECONDS=${UNDEAFEN_MIN_SECONDS:-300}
      - UNDEAFEN_MAX_SECONDS=${UNDEAFEN_MAX_SECONDS:-900}
